<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="a2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="960" height="800" fill="#ffffff"/>

  <text x="480" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#111">Twin Coupling and Decision Flow within One 15-minute Epoch</text>

  <!-- lifeline headers -->
  <g font-size="11.5" font-weight="bold" fill="#111">
    <rect x="30"  y="46" width="128" height="34" fill="#f4f4f4" stroke="#111" stroke-width="1.4" rx="3"/>
    <text x="94"  y="68" text-anchor="middle">L1/L2 Physical</text>
    <rect x="196" y="46" width="128" height="34" fill="#f7f7f7" stroke="#111" stroke-width="1.4" rx="3"/>
    <text x="260" y="68" text-anchor="middle">M-DT</text>
    <rect x="362" y="46" width="128" height="34" fill="#f7f7f7" stroke="#111" stroke-width="1.4" rx="3"/>
    <text x="426" y="68" text-anchor="middle">H-DT  ★</text>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#111">
    <rect x="546" y="46" width="150" height="34" fill="#eaeaea" stroke="#111" stroke-width="1.4" rx="3"/>
    <text x="621" y="68" text-anchor="middle">L4 Optimiser</text>
    <rect x="762" y="46" width="150" height="34" fill="#f4f4f4" stroke="#111" stroke-width="1.4" rx="3"/>
    <text x="837" y="68" text-anchor="middle">L5 Operator *</text>
  </g>

  <!-- lifelines -->
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="4 4">
    <line x1="94"  y1="80" x2="94"  y2="600"/>
    <line x1="260" y1="80" x2="260" y2="600"/>
    <line x1="426" y1="80" x2="426" y2="600"/>
    <line x1="621" y1="80" x2="621" y2="600"/>
    <line x1="837" y1="80" x2="837" y2="600"/>
  </g>

  <!-- step 1 -->
  <line x1="94" y1="110" x2="260" y2="110" stroke="#111" stroke-width="1.5"/>
  <text x="177" y="104" text-anchor="middle" font-size="10.5" fill="#111">1  sensor window</text>
  <!-- step 2 -->
  <line x1="94" y1="140" x2="426" y2="140" stroke="#111" stroke-width="1.5"/>
  <text x="260" y="134" text-anchor="middle" font-size="10.5" fill="#111">2  activity / posture log</text>

  <!-- update boxes -->
  <rect x="200" y="158" width="120" height="30" fill="#fff" stroke="#111" stroke-width="1.2" rx="3"/>
  <text x="260" y="177" text-anchor="middle" font-size="10.5" fill="#111">update H,E,Q,A</text>
  <rect x="366" y="158" width="120" height="30" fill="#fff" stroke="#111" stroke-width="1.2" rx="3"/>
  <text x="426" y="177" text-anchor="middle" font-size="10.5" fill="#111">update F,S,R,C,W</text>

  <!-- coupling M->H -->
  <line x1="260" y1="222" x2="426" y2="222" stroke="#111" stroke-width="2"/>
  <text x="343" y="216" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">3   CP3 · CP4 · CP5</text>
  <text x="343" y="236" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555">machine state → human state</text>

  <!-- coupling H->M -->
  <line x1="426" y1="270" x2="260" y2="270" stroke="#111" stroke-width="2"/>
  <text x="343" y="264" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">4   CP1 · CP2</text>
  <text x="343" y="284" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555">human state → machine state</text>

  <!-- to optimiser -->
  <line x1="260" y1="322" x2="621" y2="322" stroke="#111" stroke-width="1.5"/>
  <text x="440" y="316" text-anchor="middle" font-size="10.5" fill="#111">5  machine state vector</text>
  <line x1="426" y1="352" x2="621" y2="352" stroke="#111" stroke-width="1.5"/>
  <text x="523" y="346" text-anchor="middle" font-size="10.5" fill="#111">6  human state vector</text>

  <!-- optimiser box -->
  <rect x="536" y="372" width="170" height="86" fill="#eaeaea" stroke="#111" stroke-width="1.6" rx="3"/>
  <text x="621" y="391" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">7  decide</text>
  <text x="546" y="410" font-size="10" fill="#222">filter HC1–HC4  (hard)</text>
  <text x="546" y="427" font-size="10" fill="#222">weighted sum on feasible set</text>
  <text x="546" y="444" font-size="10" fill="#222">select by w1…w5</text>

  <!-- to operator -->
  <line x1="621" y1="484" x2="837" y2="484" stroke="#111" stroke-width="1.5"/>
  <text x="729" y="478" text-anchor="middle" font-size="10.5" fill="#111">8  allocation + explanation</text>
  <line x1="837" y1="518" x2="621" y2="518" stroke="#111" stroke-width="1.8"/>
  <text x="729" y="512" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">9  accept  /  OVERRIDE</text>

  <!-- apply -->
  <line x1="621" y1="562" x2="94" y2="562" stroke="#111" stroke-width="1.5"/>
  <text x="357" y="556" text-anchor="middle" font-size="10.5" fill="#111">10  apply allocation, advance clock by Δt = 15 min</text>

  <!-- loop bracket -->
  <path d="M 20 96 L 12 96 L 12 578 L 20 578" fill="none" stroke="#666" stroke-width="1.3"/>
  <text x="16" y="340" font-size="10" fill="#666" text-anchor="middle" transform="rotate(-90 16 340)">repeat every epoch · 32 epochs per shift</text>

  <!-- coupling equation panel -->
  <rect x="30" y="606" width="882" height="160" fill="#fbfbfb" stroke="#111" stroke-width="1.4" rx="4"/>
  <text x="44" y="626" font-size="12" font-weight="bold" fill="#111">Coupling points — the mechanism absent from static formulations</text>

  <g font-size="10.5" fill="#222">
    <text x="44"  y="650">CP1</text><text x="86" y="650">skill → quality</text>
    <text x="250" y="650" font-style="italic">defect risk rises as skill falls:   term  β2(1 − S_h,t) (normalised)  in  Q_m</text>
    <text x="44"  y="672">CP2</text><text x="86" y="672">fatigue → quality</text>
    <text x="250" y="672" font-style="italic">a tired operator produces more scrap:   term  β3 F_h (normalised)  in  Q_m</text>
    <text x="44"  y="694">CP3</text><text x="86" y="694">health → cognition</text>
    <text x="250" y="694" font-style="italic">a degraded machine demands attention:   term  γ1(1 − H_m)  in  C_h</text>
    <text x="44"  y="716">CP4</text><text x="86" y="716">intensity → fatigue</text>
    <text x="250" y="716" font-style="italic">heavier task raises the fatigue asymptote:   E′_w(task)  in  F_h</text>
    <text x="44"  y="738">CP5</text><text x="86" y="738">speed → ergonomics</text>
    <text x="250" y="738" font-style="italic">faster machine worsens posture / safety margin:   term  ψ2 v_m (normalised)  in  R_h</text>
  </g>
  <text x="700" y="650" font-size="10" fill="#666">CP1, CP2:  H-DT → M-DT</text>
  <text x="700" y="672" font-size="10" fill="#666">CP3, CP4, CP5:  M-DT → H-DT</text>
  <text x="700" y="700" font-size="10" font-style="italic" fill="#666">Removing all five reduces the</text>
  <text x="700" y="716" font-size="10" font-style="italic" fill="#666">framework to two independent</text>
  <text x="700" y="732" font-size="10" font-style="italic" fill="#666">static parameter sets.</text>
  <!-- explicit arrowheads (renderer-independent) -->
  <polygon points="260.0,110.0 251.0,114.2 251.0,105.8" fill="#111"/>
  <polygon points="426.0,140.0 417.0,144.2 417.0,135.8" fill="#111"/>
  <polygon points="426.0,222.0 417.0,226.2 417.0,217.8" fill="#111"/>
  <polygon points="260.0,270.0 269.0,265.8 269.0,274.2" fill="#111"/>
  <polygon points="621.0,322.0 612.0,326.2 612.0,317.8" fill="#111"/>
  <polygon points="621.0,352.0 612.0,356.2 612.0,347.8" fill="#111"/>
  <polygon points="837.0,484.0 828.0,488.2 828.0,479.8" fill="#111"/>
  <polygon points="621.0,518.0 630.0,513.8 630.0,522.2" fill="#111"/>
  <polygon points="94.0,562.0 103.0,557.8 103.0,566.2" fill="#111"/>
<text x="480" y="786" text-anchor="middle" font-size="10.5" fill="#666">* L5 is specified in the architecture but is not implemented in this study (steps 8 and 9).</text>
</svg>
